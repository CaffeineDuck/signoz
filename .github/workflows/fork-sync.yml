name: fork-sync

# Weekly upstream merge + image build + infra PR. Goal: stay current with SigNoz
# OSS releases while preserving the trusted-header IdentN + session bridge patches
# that this fork carries (see PR https://github.com/SigNoz/signoz/pull/11245 —
# upstream IdentN review is in flight; the session bridge stays fork-only).
#
# Trigger flow:
#   1. Pull current upstream/main
#   2. Try a merge into crowdvolt-patches
#   3a. Conflicts → open an issue with details, fail the run, do NOT push anything
#   3b. Clean → push the merge, build the new binary + frontend, build + push an
#       image to acrcvprodeusxa8x.azurecr.io/signoz-trustedheader:<tag>, then open
#       a PR in Crowd-Volt/crowdvolt-infra bumping the chart image.tag
#
# Manual trigger via workflow_dispatch is supported for ad-hoc re-syncs.

on:
  schedule:
    # Mondays at 10:00 UTC (3:30pm IST). Avoid Monday-morning US release-cycle pressure.
    - cron: '0 10 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write   # push merged commits
  issues: write     # open conflict issues
  id-token: write   # Azure OIDC federated credential

env:
  PATCH_BRANCH: crowdvolt-patches
  ACR_REGISTRY: acrcvprodeusxa8x.azurecr.io
  IMAGE_REPO: signoz-trustedheader
  UPSTREAM_REMOTE: https://github.com/SigNoz/signoz.git
  GO_VERSION: '1.25'
  NODE_VERSION: '20'

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      merge_status: ${{ steps.merge.outputs.status }}
      upstream_sha: ${{ steps.merge.outputs.upstream_sha }}
      patch_sha:    ${{ steps.merge.outputs.patch_sha }}
      image_tag:    ${{ steps.image.outputs.tag }}
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PATCH_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name  'fork-sync-bot'
          git config user.email 'fork-sync-bot@crowdvolt.com'

      - name: Try upstream merge
        id: merge
        run: |
          git remote add upstream "${UPSTREAM_REMOTE}"
          git fetch --quiet upstream main
          UPSTREAM_SHA=$(git rev-parse upstream/main | cut -c1-7)
          echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"

          # Already up to date? Skip the rest, nothing to build.
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Patch branch already contains upstream/main ($UPSTREAM_SHA). Nothing to sync."
            echo "status=noop" >> "$GITHUB_OUTPUT"
            echo "patch_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Try the merge. --no-edit takes the auto-generated merge commit message.
          if git merge --no-edit upstream/main; then
            git push origin HEAD:"${PATCH_BRANCH}"
            echo "status=clean" >> "$GITHUB_OUTPUT"
            echo "patch_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          else
            CONFLICTS=$(git diff --name-only --diff-filter=U)
            {
              echo "status=conflicts"
              echo "patch_sha=$(git rev-parse --short HEAD)"
              echo 'conflicts<<EOF'
              echo "$CONFLICTS"
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
            git merge --abort
          fi

      - name: Open conflict issue (and fail)
        if: steps.merge.outputs.status == 'conflicts'
        uses: actions/github-script@v7
        with:
          script: |
            const upstream = '${{ steps.merge.outputs.upstream_sha }}';
            const conflicts = `${{ steps.merge.outputs.conflicts }}`;
            const body = [
              `Auto-sync of \`upstream/main\` (\`${upstream}\`) into \`${{ env.PATCH_BRANCH }}\` produced conflicts.`,
              '',
              'Manual rebase needed:',
              '',
              '```',
              'git fetch upstream main',
              `git checkout ${{ env.PATCH_BRANCH }}`,
              'git merge upstream/main',
              '# resolve conflicts in the files below',
              '```',
              '',
              '**Conflicting files:**',
              '```',
              conflicts || '(no specific files reported)',
              '```',
              '',
              `Triggered by run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `fork-sync conflict: upstream ${upstream} → ${{ env.PATCH_BRANCH }}`,
              body,
              labels: ['fork-sync', 'needs-rebase'],
            });
            core.setFailed(`fork-sync conflicts: ${conflicts || 'see issue'}`);

      - name: Setup Go
        if: steps.merge.outputs.status == 'clean'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Node
        if: steps.merge.outputs.status == 'clean'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Verify build (go build + frontend yarn build)
        if: steps.merge.outputs.status == 'clean'
        run: |
          # Cross-compile linux/amd64; trimpath so binary paths don't leak runner paths.
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath \
            -ldflags="-X github.com/SigNoz/signoz/pkg/version.variant=community \
                      -X github.com/SigNoz/signoz/pkg/version.version=fork-${{ steps.merge.outputs.upstream_sha }}-${{ steps.merge.outputs.patch_sha }}" \
            -o target/signoz-linux-amd64 ./cmd/community

          cd frontend
          yarn install --frozen-lockfile
          yarn build
          cd -

          mkdir -p target/web
          cp -R frontend/build/. target/web/

      - name: Azure login (OIDC, no static creds)
        if: steps.merge.outputs.status == 'clean'
        uses: azure/login@v2
        with:
          client-id:       ${{ vars.AZURE_GHA_CLIENT_ID }}
          tenant-id:       ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        if: steps.merge.outputs.status == 'clean'
        run: az acr login --name acrcvprodeusxa8x

      - name: Build + push image
        if: steps.merge.outputs.status == 'clean'
        id: image
        run: |
          TAG="fork-${{ steps.merge.outputs.upstream_sha }}-${{ steps.merge.outputs.patch_sha }}"
          docker buildx build --platform linux/amd64 --provenance=false \
            -t "${ACR_REGISTRY}/${IMAGE_REPO}:${TAG}" \
            -f docker/fork.Dockerfile \
            --push \
            target/

          # Resolve and emit the immutable digest — we'll use it in the infra PR
          # to pin deterministically across re-pushes of the same tag.
          DIGEST=$(az acr repository show \
            --name acrcvprodeusxa8x \
            --image "${IMAGE_REPO}:${TAG}" \
            --query digest --output tsv)
          echo "tag=${TAG}"       >> "$GITHUB_OUTPUT"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Open infra-repo PR with new tag
        if: steps.merge.outputs.status == 'clean'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.INFRA_PR_TOKEN }}
          script: |
            const tag = '${{ steps.image.outputs.tag }}';
            const digest = '${{ steps.image.outputs.digest }}';
            const upstream = '${{ steps.merge.outputs.upstream_sha }}';
            const patch    = '${{ steps.merge.outputs.patch_sha }}';

            const owner = 'Crowd-Volt';
            const repo  = 'crowdvolt-infra';
            const base  = 'main';
            const branch = `signoz/fork-sync-${upstream}`;
            const path  = 'k8s/apps/signoz/base/helm-release.yaml';

            // Read current file
            const { data: file } = await github.rest.repos.getContent({ owner, repo, path, ref: base });
            const current = Buffer.from(file.content, 'base64').toString('utf-8');

            // Replace the tag line. Looks like:  tag: bridge-1778521273
            const updated = current.replace(/(\n\s+repository:\s+signoz-trustedheader\n\s+tag:\s+)\S+/,
                                            `$1${tag}`);
            if (updated === current) {
              core.setFailed('Could not find the signoz-trustedheader image tag to replace in helm-release.yaml');
              return;
            }

            // Create branch (or update existing)
            const { data: baseRef } = await github.rest.git.getRef({ owner, repo, ref: `heads/${base}` });
            try {
              await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${branch}`, sha: baseRef.object.sha });
            } catch (e) {
              if (e.status !== 422) throw e;  // 422 = already exists; we'll update it below
              await github.rest.git.updateRef({ owner, repo, ref: `heads/${branch}`, sha: baseRef.object.sha, force: true });
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path,
              message: `chore(signoz): fork-sync ${upstream}-${patch}\n\nImage: ${tag}\nDigest: ${digest}`,
              content: Buffer.from(updated).toString('base64'),
              branch,
              sha: file.sha,
            });

            const body = [
              `Auto-generated by \`.github/workflows/fork-sync.yml\` in \`CaffeineDuck/signoz\`.`,
              '',
              `**Upstream merged:** SigNoz \`${upstream}\``,
              `**Patch HEAD:** \`${patch}\``,
              `**Image:** \`acrcvprodeusxa8x.azurecr.io/signoz-trustedheader:${tag}\``,
              `**Digest:** \`${digest}\``,
              '',
              'Merge once green to roll forward. Revert by resetting the tag value to whatever was there before.',
            ].join('\n');

            // Find or create PR
            const { data: prs } = await github.rest.pulls.list({ owner, repo, head: `${owner}:${branch}`, base, state: 'open' });
            if (prs.length === 0) {
              await github.rest.pulls.create({ owner, repo, base, head: branch,
                title: `chore(signoz): fork-sync upstream ${upstream}`, body });
            } else {
              await github.rest.pulls.update({ owner, repo, pull_number: prs[0].number, body });
            }
